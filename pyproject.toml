[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flaas-research-tools"
version = "0.1.0"
description = "Tools for generating and composing Federated Learning as a Service catalogues"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
flaas-generate = "flaas_data_generator.cli.main:main"
flaas-compose = "flaas_composition.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["flaas_data_generator*", "flaas_composition*"]
exclude = ["*.test", "*.test.*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
flaas_data_generator = ["storage/schema.sql", "clients/recipe_evidence.json"]
flaas_composition = ["assets/*.json", "assets/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
